name: FX Monte Carlo Engine

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows manually triggering the workflow from the GitHub UI
  workflow_dispatch:

jobs:
  run-mc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monte Carlo Engine
        run: python fx_monte_carlo.py

      - name: Commit and push generated results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mc_daily_results/ mc_weekly_results/
          git diff --staged --quiet || git commit -m "chore: automated MC simulation results [skip ci]"
          git push