name: FX Monte Carlo Weekly

on:
  schedule:
    # Offset from :00 to avoid the 00:00 UTC congestion window that can
    # cause GitHub to silently drop scheduled runs (same time as mc_daily.yml).
    - cron: '17 0 * * 1'
    # Backup trigger a few hours later in case the primary run gets dropped
    # (GitHub gives no delivery guarantee for scheduled workflows). Skips
    # committing if this week's forecast was already generated.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if today's weekly forecast already exists
        id: guard
        run: |
          if ls mc_results/mc_W_all_pairs_$(date -u +%Y%m%d)_*.json >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run FX Monte Carlo
        if: steps.guard.outputs.skip == 'false'
        run: python fx_monte_carlo.py W

      - name: Build API outputs
        if: steps.guard.outputs.skip == 'false'
        run: python build_api.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mc_results/ api/
          git diff --cached --quiet || (git commit -m "MC: weekly forecast $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase && git push)
